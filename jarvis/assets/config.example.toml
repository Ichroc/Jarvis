# Configuration de Jarvis
# Copie ce fichier dans ~/.jarvis/config.toml (la commande « jarvis config --creer » le fait pour toi).
# Tu ne gardes que ce que tu veux changer : tout le reste a une valeur par défaut.

[general]
nom = "Ichroc"              # ton prénom
appellation = "Monsieur"     # comment Jarvis s'adresse à toi ("" pour rien)
tutoiement = false           # true : Jarvis te tutoie
ville = "Angers"             # ville par défaut pour la météo

[cerveau]
modele = "qwen3.5:9b"                       # 6,6 Go · outils, vision, réflexion
modele_embeddings = "qwen3-embedding:0.6b"  # 0,6 Go · mémoire et recherche de documents
reflexion = false            # true : raisonnement plus poussé en mode écrit (plus lent)
temperature = 0.6
contexte = 12288             # taille du contexte en jetons (plus grand = plus de mémoire vive)
garder_charge = "30m"        # durée pendant laquelle le modèle reste chargé après usage
prechauffage = true          # au lancement, prépare le modèle : la 1re réponse est aussi rapide que les suivantes

[voix]
active = true
moteur = "auto"              # auto | ollama | piper | say | ptts | espeak | aucun
debit = 1.0                  # vitesse de parole : 0,8 plus lent, 1,2 plus rapide
# Mac Apple Silicon : voix Phonon, servie par Ollama (≥ 0.40.11)
modele_tts = "phonon:fr"
voix = "Noémie"              # féminines : Noémie, Coralie, Tiphaine, Maëlys, Orianne, Solène, Ninon, Lilou, Hélène
                             # masculines : Augustin, Arnaud, Jules, Baptiste, Lucien, Marius
# Linux (et repli sur Mac) : voix Piper, sur le processeur
voix_piper = "fr_FR-siwis-medium"  # féminine ; « jarvis voix » liste les autres
voix_say = "Amélie"          # dernier recours sur Mac : voix intégrée à macOS
lire_reponses_ecrites = false  # true : Jarvis lit aussi à voix haute les réponses aux questions tapées

[oreilles]
active = true
moteur = "auto"              # auto | mlx-whisper | parakeet | faster-whisper
modele_whisper = "mlx-community/whisper-large-v3-turbo"
vocabulaire = ["ESEO", "Kubernetes", "Docker", "Wazuh", "TryHackMe"]  # aide à bien écrire tes mots
mot_activation = true        # « Hey Jarvis »
seuil_activation = 0.5       # plus haut = moins de faux déclenchements
silence_fin_ms = 700         # silence qui marque la fin de ta phrase
conversation_continue = true # après une réponse, Jarvis écoute 5 s sans « Hey Jarvis »
micro = ""                   # "" = micro par défaut (voir « jarvis doctor »)

[securite]
mode_prudent = false         # true : toute action (pas seulement les sensibles) demande ton accord
internet = true              # false : aucun outil réseau (météo, Wikipédia, recherche web)
shell = true                 # commandes terminal, toujours avec ton accord
journal = true               # journal d'audit dans ~/.jarvis/journal/audit.jsonl
delai_confirmation_s = 45

[interface]
port = 7777
ouvrir_navigateur = true
lecteur_musique = "Music"    # ou "Spotify"

[documents]
dossiers = ["~/Documents"]   # dossiers indexés par « jarvis index »
